spring.application.name=secured-api
spring.main.web-application-type=servlet
spring.threads.virtual.enabled=false
server.forward-headers-strategy=none
server.tomcat.max-connections=64
server.tomcat.accept-count=32
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=2
server.max-http-request-header-size=8KB
spring.mvc.async.request-timeout=5s
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=32
spring.task.execution.simple.concurrency-limit=8
facility.web.exception.use-problem-detail=true
facility.web.trace.accept-inbound=false
facility.web.access-log.enabled=false

# Production must supply issuer-uri, exactly one audience and app.security.resource-uri.
# No identity or local profile is selected when configuration is missing.

# PostgreSQL URL/user/password are deployment-owned; Flyway is the only schema owner.
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.lock-retry-count=2
spring.flyway.connect-retries=0
# Do not silently accept a schema from a newer application or leave known migrations pending.
spring.flyway.ignore-migration-patterns=
# Distinct finite stages; these do not add up to an exact HTTP deadline.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=500
spring.datasource.hikari.initialization-fail-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=4
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=1
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=2000 -c lock_timeout=500
spring.jdbc.template.query-timeout=2s
