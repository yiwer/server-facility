# =====================================================================
# server-facility 配置样例(application.example.yaml)
# =====================================================================
# Spring Boot 不自动加载此文件；按需将所选片段复制进应用的 application.yml。
# 属性定义以 Facility*Properties 为准，装配条件与能力边界见 docs/USAGE.md。
# 不要把 enabled 理解为统一开关：缓存、重复读与旧 trace 默认关闭；
# 限流/幂等关闭默认 provider 后，HTTP 注解守卫仍拒绝无保护执行。
# 正预算由各组件在使用/构造时校验，不依赖 Bean Validation provider。
# Duration 使用 Boot 时长语法：500ms / 5s / 10m / PT10M。
# 应用拥有 Jsons、MessageSource、Executor、RestClient.Builder 等依赖；
# Core / Json / Locale / Async 没有 facility.* 属性，按实际 bean 条件定制。
# hash / crypto / masking / csv / excel 无自动装配开关；optional 格式引擎
# 是否可用及调用预算仍由各能力的公开契约决定。
# =====================================================================

facility:

  # -------------------------------------------------------------------
  # 雪花 ID(FacilityIdAutoConfiguration / id.FacilityIdProperties)
  # -------------------------------------------------------------------
  id:
    # 新业务直接 JDK UUID。SnowId 默认不装配；旧 IdUtil 缺 provider 明确失败。
    enabled: false

    # -1 表示缺配置；显式启用时必须分配两项0..3节点，不能同时复用。
    # 重启还须严格晚于旧owner已发最大时间戳；本库不分配节点或持久化高水位。
    worker-id: -1
    data-center-id: -1

    # 每次观察超阈值回拨，true立即拒绝；false允许等待更大回拨。
    # 两种模式均服从同一单调总预算和中断，不再无限等待（ADR0033）。
    clock-backwards-threshold-millis: 5
    throw-on-clock-backwards-exceed-threshold: true
    wait-timeout: 1s  # 正Duration，至多1分钟；含锁准入、恢复及序列耗尽

    # 纪元起点(epoch millis)。默认 1735660800000 = 2025-01-01 00:00:00 UTC+8。
    # 同一部署环境一经投产请勿更改——更改会打乱既有 ID 的时间解析与排序。
    start-timestamp: 1735660800000

  # -------------------------------------------------------------------
  # Servlet Web；应用自行引入 Web/MVC/Servlet 依赖。
  # TraceIdFilter / ClientIpPolicy / RepeatableRequestFilter 按类型让位；
  # 同一 filter 只注册一次。AccessLogInterceptor 要替换时先关闭其开关。
  # 全局 advice 按 AbstractGlobalExceptionHandler 让位；共享 Filter/MVC/ERROR
  # 错误策略可用 FacilityHttpErrors bean 接管，详见 ADR0027/0029/0049。
  # -------------------------------------------------------------------
  web:
    # 旧相关性 filter 显式 opt-in；新应用使用宿主 Micrometer tracing。
    trace:
      enabled: false
      header-name: X-Trace-Id
      mdc-key: traceId
      # 入站值仅用于相关性，不代表身份；校验 [0-9A-Za-z_-]{1,64}。
      # 不可信入口可设 false；宿主已有 MDC trace 优先。
      accept-inbound: true
      generate-if-absent: true

    proxy:
      # 默认只接受数字 Servlet peer，不解析 DNS、不信任任意转发头。
      # 仅按实际部署填入可信代理的数字 IP/CIDR；这不是用户认证。
      trusted-proxies: []

    # 仅为选中的同步有限 body 提供重复读取，不作为通用上传缓存。
    repeatable-request:
      enabled: false
      # 必须为正数；超限 413，0/负数拒绝构造。默认 10 MiB。
      max-body-bytes: 10485760
      # Ant 路径；可缩小为 ["/webhooks/**"]；空列表不选择请求。
      include-paths: ["/**"]
      # MediaType 匹配，支持结构化后缀；不是任意字符串前缀。
      include-content-types:
        - application/json
        - "application/*+json"
        - application/xml
        - "application/*+xml"
        - "text/*"
      exclude-paths: ["/actuator/**"]

    # 标准 SLF4J 的 method/匹配路由模板/status/duration，不输出原始请求正文。
    access-log:
      enabled: true
      # 达到正阈值时 WARN 并标 slow；0 禁用慢请求标记。
      slow-threshold-millis: 1000

    cors:
      enabled: true
      # 默认空列表不开跨域；按应用明确列出允许的来源。
      allowed-origins: []
      allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
      allowed-headers: ["*"]
      allow-credentials: false
      max-age: 3600

    exception:
      # 默认 RFC 9457 ProblemDetail + 真实状态/必要头。
      # false 显式选择安全的旧 HTTP 200 envelope（429 仍是 429）。
      use-problem-detail: true
      # 仅保留旧属性绑定；任何 profile 都不自动暴露异常正文/调试栈。
      include-trace-profiles: []

  # -------------------------------------------------------------------
  # 进程内入口配额；跨实例/业务配额须由应用提供相应 RateLimiter。
  # -------------------------------------------------------------------
  ratelimit:
    # 仅关闭默认 provider；Servlet 注解守卫继续存在，宿主 provider 优先。
    enabled: true
    # 缺失/不可用默认拒绝；仅明确接受入口保护降级时才设 true。
    fail-open: false
    default-capacity: 100
    default-permits-per-second: 10
    # 正数主体槽位上限；只回收已补满桶，不清空其他主体额度。
    # 新主体无法安全准入时拒绝；不是回收所有闲置桶的后台任务。
    max-buckets: 100000

  # -------------------------------------------------------------------
  # 显式本地缓存（ADR0031）；宿主 CacheManager 优先。
  # 启用须同时存在 Caffeine + spring-context-support，缺任一启动失败。
  # 不再回退永不过期的 ConcurrentMapCacheManager。
  # -------------------------------------------------------------------
  cache:
    enabled: false
    # 启用前设置有限且非空、无重复的名字，例如 [catalog, exchange-rates]。
    # 未列名字不创建 cache；不要从请求数据动态派生名称。
    cache-names: []
    # 正 expire-after-write 时长，须能精确表示为 long 纳秒。
    default-ttl: 10m
    # 每个 cache 的正条目上限；由 Caffeine maintenance 执行，不是字节预算。
    maximum-size: 10000

  # -------------------------------------------------------------------
  # 本地互斥（ADR0030）；默认仅提供 LocalKeyedMutex，不满足 DistributedLock。
  # 需要跨进程能力时，应用必须显式提供真实 adapter。
  # -------------------------------------------------------------------
  lock:
    # false 不装配本地 mutex；必需旧 LockUtil 缺实现时拒绝，不裸执行 action。
    enabled: true
    # 正活动键上限，含持有者和等待者；最后退出时才安全回收。
    # 等待预算由调用传入；没有能提前释放实际工作者的持有租约。
    max-locks: 100000

  # -------------------------------------------------------------------
  # HTTP（ADR0048）；新代码注入 Boot RestClient.Builder 构造具名服务 Adapter。
  # 默认 RestClient 优先克隆宿主 builder，保留其 factory/JSON/观测/customizer。
  # -------------------------------------------------------------------
  http:
    enabled: true
    # 仅宿主 builder 缺席的兼容 factory 使用这两个超时，合法范围 1ms..2147483647ms。
    # 不会覆盖应用 builder；连接/读取超时也不是整个操作的截止时间。
    connect-timeout: 5s
    read-timeout: 10s
    # enabled=false 不注册默认 client；已弃用 HttpClients 仍可能使用历史
    # 未配置 fallback，不是应用 Adapter 的有界执行政策。

  # -------------------------------------------------------------------
  # Qualified claim + 当前授权 HTTP 重放（ADR0034/0035）。
  # HTTP 目标必须提供 IdempotencyAuthorization，仅做当前授权/规范化，
  # 不执行业务副作用；每次重放前重新授权。默认 Store 进程内、关闭/重启失忆。
  # 跨实例持久化/业务唯一性须由真实 Store/事务协议提供，不能只替换存储名字。
  # -------------------------------------------------------------------
  idempotency:
    # false 关闭默认 Store/filter；@Idempotent 守卫继续拒绝无保护执行。
    enabled: true
    # 已弃用兼容回退：lease/result-retention 未设时各使用此 5m。
    default-ttl: 5m
    # 新应用独立选择两个正整毫秒时长；以下是示例，不是额外默认值。
    # lease: 30s
    # result-retention: 5m
    # lease 到期可有新 owner，但不能取消旧业务；结果到期只释放正文，不重授执行。
    # 新 claim 的绑定/终态占据有限槽位直到 close；满额明确拒绝，不因过期清掉。
    max-entries: 100000
    # 仅选定有限同步请求/响应使用正字节预算；普通响应流直通。
    max-request-bytes: 1048576
    max-response-bytes: 1048576
    # 默认 Store 合计正文/元数据驻留预算；不包含任意业务对象或容器缓冲。
    max-stored-receipt-bytes: 67108864
