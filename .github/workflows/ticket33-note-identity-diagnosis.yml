name: Ticket 33 bounded NoteIdentityStorage diagnosis

on:
  push:
    branches: [codex/ticket-33-diagnosis]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
          overwrite-settings: false
      - name: Run four predetermined diagnostic configurations once each
        run: python3 -B verification/diagnosis/NoteIdentity.py run
      - name: Publish only allowlisted structured diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: note-identity-diagnosis-${{ github.sha }}-${{ github.run_attempt }}
          path: .verification-results/note-identity/public/
          include-hidden-files: true
          archive: true
          if-no-files-found: error
          retention-days: 30
