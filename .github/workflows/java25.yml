name: Java 25 library and consumer

on:
  push:
    branches: [codex/server-facility-next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install negative-test JDK
        id: java21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          overwrite-settings: false
      - name: Install supported JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
          overwrite-settings: false
      - name: Prepare pinned native PostgreSQL 18.6
        shell: pwsh
        run: |
          $databaseTools = Join-Path $env:RUNNER_TEMP 'facility-postgres-18.6'
          java templates/secured-api/dev/PreparePostgres.java $databaseTools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PG_BIN=$(Join-Path $databaseTools 'bin')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REDGATE_DISABLE_TELEMETRY=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force .verification-results/native-postgres | Out-Null
          Copy-Item -LiteralPath (Join-Path $databaseTools 'provenance.txt') -Destination .verification-results/native-postgres/provenance.txt
      - name: Clean build, independent consumer, resource and prerequisite checks
        env:
          VERIFY_WRONG_JAVA_HOME: ${{ steps.java21.outputs.path }}
        run: java verification/Verify.java all --fresh
      - name: Independent platform toolchain and engine controls
        if: ${{ !cancelled() }}
        run: java verification/Verify.java platform --fresh
      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java25-${{ matrix.os }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            .verification-results/**/summary.txt
            .verification-results/native-postgres/**
            .verification-results/**/*.log
            .verification-results/**/effective-pom.xml
            .verification-results/**/dependency-tree.txt
            .verification-results/**/json-consumer-effective-pom.xml
            .verification-results/**/json-consumer-pom.xml
            .verification-results/**/json-consumer-dependency-tree.txt
            .verification-results/**/csv-consumer-*.xml
            .verification-results/**/csv-consumer-*.txt
            .verification-results/**/excel-inputs/**
            .verification-results/**/excel/**
            .verification-results/**/CsvConsumer.java
            .verification-results/**/JsonConsumer.java
            .verification-results/**/PlatformWebConsumer.java
            .verification-results/**/PlatformUploadConsumer.java
            .verification-results/**/core-consumer/CoreConsumer.java
            .verification-results/**/value-consumer/**
            .verification-results/**/mapping-consumer/**
            .verification-results/**/crypto-consumer/CryptoConsumer.java
            .verification-results/**/io-consumer/IoConsumer.java
            .verification-results/**/rate-limit-consumer/RateLimitConsumer.java
            .verification-results/**/html-consumer/**
            .verification-results/**/partner/**
            .verification-results/**/partner-inputs/**
            .verification-results/**/claim-consumer/inputs/**
            .verification-results/**/lock-consumer/inputs/**
            .verification-results/**/CacheConsumer.java
            .verification-results/**/cache-consumer-*.xml
            .verification-results/**/cache-consumer-*.txt
            .verification-results/**/HttpReplayConsumer.java
            .verification-results/**/http-replay-consumer-*.xml
            .verification-results/**/http-replay-consumer-*.txt
            .verification-results/**/artifacts/*.jar
            .verification-results/**/matrix-inputs/**
            .verification-results/**/matrix/**
            .verification-results/**/template-inputs/**
            .verification-results/**/template/**
            .verification-results/**/json-golden/**
            .verification-results/**/surefire-reports/**
            .verification-results/**/jacoco/**
            .verification-results/**/platform-inputs/**
            .verification-results/**/platform-positive/platform-probe.jar
            .verification-results/**/platform-positive/spring-configuration-metadata.json
            target/*.jar
